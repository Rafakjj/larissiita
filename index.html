    <style>
        body {

            align-items: center;

            margin: 0;
            color: #333;
            padding: 20px;
            box-sizing: border-box;
        }

            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border-top: 8px solid #e23636;
        }
        h2 {
            color: #e23636;
            font-size: 20px;
            margin-bottom: 20px;
            min-height: 55px;
        }
        button {
            display: block;
            width: 100%;
            background-color: #e23636;
            color: white;
            border: none;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        button:hover:not(:disabled) { background-color: #1a426b; }
        button.correct {
            background-color: #28a745 !important;
            transform: scale(1.02);
        }
        button.wrong { background-color: #dc3545 !important; }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }
        #loading, #result { display: none; }
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #e23636;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .resultado-texto {
            font-size: 26px;
            line-height: 1.4;
            color: #1a426b;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .contador {
            font-size: 14px;
            color: #888;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .meme-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: 10px;
            background-color: #0b1a2a;
            border-radius: 8px;
            overflow: hidden;
        }
        .meme-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        .meme-text {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 32px;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            width: 90%;
            text-shadow:
                2px 2px 0 #000,
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                0 4px 6px rgba(0,0,0,0.8);
            line-height: 1.1;
        }

<script>
    const questions = [
        {
            question: "Quem foi o responsável por dizer a famosa frase: 'Com grandes poderes vêm grandes responsabilidades' nos filmes clássicos?",
            answers: ["Tio Ben", "Tony Stark", "Capitão América", "Tia May"],
            correct: 0
        },
        {
            question: "Qual desses vilões descobriu primeiro a identidade secreta de Peter Parker (do Tobey Maguire)?",
            answers: ["Doutor Octopus", "Duende Verde", "Venom", "Homem-Areia"],
            correct: 1
        },
        {
            question: "Qual é o nome do jornal onde o Peter Parker trabalha tirando fotos?",
            answers: ["Planeta Diário", "Clarim Diário", "Globo Diário", "Jornal de Nova York"],
            correct: 1
        },
        {
            question: "Nos filmes do Andrew Garfield, quem é o grande amor de Peter Parker?",
            answers: ["Mary Jane", "Gwen Stacy", "Michelle Jones", "Felicia Hardy"],
            correct: 1
        },
        {
            question: "Em 'O Espetacular Homem-Aranha 2' (Andrew Garfield), qual vilão é o responsável direto pela queda trágica da Gwen?",
            answers: ["Electro", "Lagarto", "Rino", "Duende Verde"],
            correct: 3
        },
        {
            question: "Quem é o melhor amigo nerd do Peter Parker nos filmes do Tom Holland?",
            answers: ["Harry Osborn", "Flash Thompson", "Ned Leeds", "Miles Morales"],
            correct: 2
        },
        {
            question: "Qual o nome da Inteligência Artificial do primeiro traje que o Tony Stark deu pro Peter (Tom Holland)?",
            answers: ["J.A.R.V.I.S.", "K.A.R.E.N.", "F.R.I.D.A.Y.", "E.D.I.T.H."],
            correct: 1
        },
        {
            question: "Em 'Sem Volta Para Casa', como o Homem-Aranha do Andrew Garfield consegue sua 'redenção' emocional?",
            answers: ["Derrotando o Duende Verde", "Salvando a MJ da queda", "Voltando no tempo", "Curando o Electro sozinho"],
            correct: 1
        },
        {
            question: "Em 'De Volta ao Lar' (Tom Holland), qual é o maior plot twist sobre o vilão Abutre?",
            answers: ["Ele era um Skrull disfarçado", "Ele era pai do Ned", "Ele era pai da Liz (garota que o Peter gostava)", "Ele trabalhava pro Clarim Diário"],
            correct: 2
        },
        {
            question: "Qual foi a principal motivação do Mysterio no filme 'Longe de Casa' (Tom Holland)?",
            answers: ["Roubar a tecnologia E.D.I.T.H. deixada pelo Tony Stark", "Matar o Nick Fury", "Dominar o multiverso", "Destruir a base dos Vingadores"],
            correct: 0
        }
    ];

    let currentQuestion = 0;
    let aura = 0;

    function loadQuestion() {
        if (currentQuestion >= questions.length) {
            showLoading();
            return;
        }

        document.getElementById('contador-perguntas').innerText =
            `Pergunta ${currentQuestion + 1} de ${questions.length}`;
        document.getElementById('question').innerText =
            questions[currentQuestion].question;

        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";

        questions[currentQuestion].answers.forEach((answer, index) => {
            const btn = document.createElement('button');
            btn.innerText = answer;

            btn.onclick = () => {
                const allButtons = optionsDiv.querySelectorAll('button');
                allButtons.forEach(b => b.disabled = true);

                if (index === questions[currentQuestion].correct) {
                    aura += 1000;
                    btn.classList.add('correct');
                } else {
                    aura -= 1000;
                    btn.classList.add('wrong');
                    allButtons[questions[currentQuestion].correct].classList.add('correct');
                }

                setTimeout(() => {
                    currentQuestion++;
                    loadQuestion();
                }, 1500);
            };

            optionsDiv.appendChild(btn);
        });
    }

    function showLoading() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            document.getElementById('aura-final').innerText =
                `voce farmou ${aura} de aura larissita! ✨`;
        }, 3000);
    }

    loadQuestion();
</script>
